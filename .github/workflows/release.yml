name: Release

# Started by a tag (v1.2.3). Builds the app on a runner of each system, tries each packaged app, and publishes the installers with their checksums and a
# build provenance attestation. The tag must name the version in apps/runner-desktop/package.json: the updater reads the version from there.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag and the source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: version
        name: The tag names the version of the app
        run: |
          version="$(node -p "require('./apps/runner-desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but apps/runner-desktop/package.json says $version. The updater reads the version from the manifest, so they must match."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  package:
    name: Package for ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # The signing secrets live in this protected environment and nowhere else. Without them the build still runs, unsigned, and says so in the notes.
    # The environment is only as protected as its settings: in the repository settings it must have required reviewers (somebody other than whoever pushes the
    # tag has to approve each run) and a deployment rule that limits it to tags like v*.*.*. Without those, whoever can push a tag can use the secrets.
    environment: release
    timeout-minutes: 45
    strategy:
      # A system that breaks says nothing about the others, and a release is all three or none: the publish job needs every leg.
      fail-fast: false
      matrix:
        include:
          # Both Mac architectures in one job: they share one update feed file (latest-mac.yml), and two jobs would each write their own over the other.
          - { label: macOS, family: mac, os: macos-15, targets: '--mac --arm64 --x64' }
          - { label: Windows, family: win, os: windows-2025, targets: '--win --x64' }
          - { label: Linux, family: linux, os: ubuntu-24.04, targets: '--linux --x64' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Only the packaging step sees a secret, and only the ones of its own system. A secret that is not set arrives here as an empty string, and
      # scripts/signing-environment.mjs treats it as absent: the build is then unsigned and does not look for a certificate on the machine.
      # It runs what was built above and does not build again: code that is built is built without a secret in its environment.
      # --publish never: electron-builder would otherwise create the release itself, apart from the checksums and the attestation.
      - name: Package
        shell: bash
        env:
          CSC_LINK: ${{ matrix.family == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.family == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.family == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.family == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.family == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.family == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.family == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          label="$(node apps/runner-desktop/scripts/package.mjs --print-signing)"
          pnpm --filter @escritoriio/runner-desktop package:only ${{ matrix.targets }} --publish never
          echo "${{ matrix.label }}: $label" > "signing-${{ matrix.family }}.txt"
      # What the build was asked for is not taken on trust: the fuses that let a copy of the program run other code (run as Node, Node's options from the
      # environment, Node's inspector) are read from the packaged app itself, and a build in which one is on does not go on to be released.
      - name: Check the fuses of the packaged app (macOS)
        if: matrix.family == 'mac'
        run: node apps/runner-desktop/scripts/fuses-check.mjs "apps/runner-desktop/release/mac-arm64/Escritoriio Runner.app"
      - name: Check the fuses of the packaged app (Windows)
        if: matrix.family == 'win'
        run: node apps/runner-desktop/scripts/fuses-check.mjs "apps/runner-desktop/release/win-unpacked/Escritoriio Runner.exe"
      # The AppImage is a compressed file system: the program that Electron is in is read from the unpacked copy that electron-builder leaves beside it (the largest executable there).
      - name: Check the fuses of the packaged app (Linux)
        if: matrix.family == 'linux'
        run: |
          program="$(find apps/runner-desktop/release/linux-unpacked -maxdepth 1 -type f -perm -u+x -printf '%s %p\n' | sort -rn | head -n 1 | cut -d' ' -f2-)"
          node apps/runner-desktop/scripts/fuses-check.mjs "$program"
      # The packaged app itself is started with --smoke: it must load, and leave with a zero code, without a window of its own, a tray, a pairing
      # or a read of the real settings. A smoke test that cannot fail is not one, so this step is not allowed to; it needs the flag in the app.
      - name: Smoke test the packaged app (macOS)
        if: matrix.family == 'mac'
        run: node apps/runner-desktop/scripts/smoke.mjs "apps/runner-desktop/release/mac-arm64/Escritoriio Runner.app/Contents/MacOS/Escritoriio Runner"
      - name: Smoke test the packaged app (Windows)
        if: matrix.family == 'win'
        run: node apps/runner-desktop/scripts/smoke.mjs "apps/runner-desktop/release/win-unpacked/Escritoriio Runner.exe"
      # The AppImage is what people download. It is run unpacked (a runner has no FUSE) and with the Chromium sandbox off (the helper is not set-uid
      # there): neither changes what the app loads.
      - name: Smoke test the packaged app (Linux)
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          appimage="$(ls apps/runner-desktop/release/*.AppImage)"
          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run --auto-servernum node apps/runner-desktop/scripts/smoke.mjs "$appimage" --no-sandbox
      # What goes on the release: the installers, the files the updater reads and the block maps it uses for smaller downloads.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: files-${{ matrix.family }}
          path: |
            apps/runner-desktop/release/*.dmg
            apps/runner-desktop/release/*.zip
            apps/runner-desktop/release/*.exe
            apps/runner-desktop/release/*.AppImage
            apps/runner-desktop/release/*.deb
            apps/runner-desktop/release/*.blockmap
            apps/runner-desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-${{ matrix.family }}
          path: signing-${{ matrix.family }}.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Checksums, attestation and release
    needs: [verify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: files-*
          merge-multiple: true
          path: files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signing-*
          merge-multiple: true
          path: signing
      - name: Checksums
        working-directory: files
        run: |
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # The attestation says that these exact files were built by this workflow from this commit. The checksum file is a subject too.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: files/*
      - name: Release notes
        run: |
          {
            echo "Escritoriio Runner $VERSION."
            echo
            echo "How each installer was signed:"
            echo
            sed 's/^/- /' signing/signing-*.txt
            echo
            if grep --quiet --ignore-case 'unsigned' signing/signing-*.txt; then
              echo "**An unsigned build is not vouched for by Apple or Microsoft**, so your system warns you the first time you open it (see the README for how to open it). On macOS an unsigned app cannot update itself: download the new version by hand."
              echo
            fi
            echo "Verify a download: compare it with SHA256SUMS, and run \`gh attestation verify <file> --repo $GH_REPO\` (see the README)."
          } > notes.md
          cat notes.md
      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" files/* --verify-tag --title "Escritoriio Runner $VERSION" --notes-file notes.md
