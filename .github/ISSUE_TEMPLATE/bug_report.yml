name: Something does not work
description: The app or the runner does not do what it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the app, or from the release you downloaded.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of the doctor
      description: The Doctor screen or `escritoriio-runner doctor`. It hides keys and tokens before it prints, but read it before you paste it.
      render: text
